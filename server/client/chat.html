<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoChat | Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="chat-body">
    <main class="chat-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-dot"></div>
          <div>
            <h1 class="brand-title">CryptoChat</h1>
            <p id="currentUserLabel" class="brand-subtitle"></p>
          </div>
        </div>

        <div class="sidebar-top-actions">
          <button id="themeToggleBtn" type="button" class="secondary-btn">Dark Mode</button>
          <button id="refreshUsersBtn" type="button" class="secondary-btn">Refresh</button>
          <button id="logoutBtn" type="button" class="danger-btn">Logout</button>
        </div>

        <label class="search-wrap" for="userSearchInput">
          <span>Search users</span>
          <input
            id="userSearchInput"
            type="text"
            placeholder="Search by username..."
            autocomplete="off"
          />
        </label>

        <div id="conversationList" class="conversation-list"></div>
      </aside>

      <section class="chat-main">
        <header class="chat-header">
          <div class="chat-user-meta">
            <div id="activeUserAvatar" class="avatar avatar-lg">?</div>
            <div>
              <h2 id="activeChatLabel">Select a conversation</h2>
              <p id="typingIndicator" class="typing-label hidden"></p>
            </div>
          </div>
          <span id="socketStatus" class="socket-status">Offline</span>
        </header>

        <section id="messagesContainer" class="messages" aria-live="polite"></section>

        <section id="gifPicker" class="gif-picker hidden">
          <div class="gif-picker-head">
            <input
              id="gifSearchInput"
              type="text"
              placeholder="Search GIFs..."
              autocomplete="off"
            />
            <button id="manualGifBtn" type="button" class="secondary-btn">Paste URL</button>
            <button id="closeGifBtn" type="button" class="secondary-btn">Close</button>
          </div>
          <div id="gifResults" class="gif-results"></div>
        </section>

        <form id="messageForm" class="composer">
          <input id="imageInput" type="file" accept="image/*" hidden />

          <div id="emojiPanel" class="emoji-panel hidden"></div>

          <div class="composer-row">
            <div class="composer-tools">
              <button id="emojiToggleBtn" type="button" class="icon-btn" title="Emoji">☺</button>
              <button id="imageUploadBtn" type="button" class="icon-btn" title="Upload image">
                +
              </button>
              <button id="gifToggleBtn" type="button" class="icon-btn" title="Send GIF">GIF</button>
            </div>

            <textarea
              id="messageInput"
              rows="1"
              maxlength="3000"
              placeholder="Type a message..."
            ></textarea>

            <button id="sendBtn" type="submit" class="send-btn">Send</button>
          </div>
        </form>

        <p id="statusMessage" class="status"></p>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
