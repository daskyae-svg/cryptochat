<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoChat | Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="chat-body">
    <main class="chat-layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <h1>CryptoChat</h1>
          <p id="currentUserLabel"></p>
        </div>
        <div class="sidebar-actions">
          <button id="refreshUsersBtn" type="button" class="ghost-btn">Refresh Users</button>
          <button id="logoutBtn" type="button" class="danger-btn">Logout</button>
        </div>
        <h2 class="sidebar-title">People</h2>
        <ul id="userList" class="user-list"></ul>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <h2 id="activeChatLabel">Select a user to start chatting</h2>
          <span id="socketStatus" class="socket-status">Disconnected</span>
        </header>

        <div id="messagesContainer" class="messages"></div>

        <form id="messageForm" class="message-form">
          <input
            id="messageInput"
            type="text"
            placeholder="Type your message..."
            autocomplete="off"
            maxlength="3000"
          />
          <button type="submit">Send</button>
        </form>

        <p id="statusMessage" class="status"></p>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
